name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20'
          cache: npm
      - run: npm ci
      # Line endings, script syntax, both typechecks, the unit suite and the five offline
      # end-to-end suites. No network beyond the npm install above.
      - run: npm run check
