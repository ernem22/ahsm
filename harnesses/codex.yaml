id: codex
label: Codex
detect:
  - ~/.codex
  - path:codex
agentId: codex
requires: [codex]
config:
  path: ~/.codex/config.toml
  format: toml
hooks:
  path: ~/.codex/hooks.json
  section: hooks.{event}
skills:
  path: ~/.codex/skills
mcp:
  path: ~/.codex/config.toml
  key: mcp_servers
  format: toml
